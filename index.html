<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff0f5"><title>Мир Вовки</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#26324b;background:linear-gradient(145deg,#fff3d6,#ffe8f1,#e6f5ff);min-height:100vh}header{text-align:center;padding:24px 12px}h1{margin:0;color:#6545a0;font-size:40px}main{max-width:850px;margin:auto;padding:12px 16px 32px}.note,.card,.game{background:white;border-radius:22px;padding:15px;text-align:center}.grid,.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{border:0;border-radius:22px;padding:20px 8px;font-size:19px;font-weight:800;min-height:115px}.tile span{display:block;font-size:40px}.pink{background:#ffc3d9}.blue{background:#bce6ff}.yellow{background:#ffeba8}.green{background:#c8f1d0}.purple{background:#dfd1ff}.view{display:none}.active{display:block}.top{display:flex;gap:12px;align-items:center;margin:12px 0}.back,.sound,.choice{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:#fff0a8;color:#26324b}.back{background:white}.card{padding:12px;box-shadow:0 5px 15px #65718a20}.emoji{font-size:48px;display:block}.name{font-size:18px;font-weight:800}.sound{margin-top:10px}.choice{display:block;width:100%;margin:8px 0;background:#e8f4ff;font-size:18px}@media(min-width:650px){.grid,.cards{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><h1>🌈 Мир Вовки</h1><p>Играем, слушаем и учимся!</p></header><main>
<p class="note">🔊 Нажимай на карточки: услышишь русское название и игровой звуковой эффект.</p>
<section id="home" class="view active"><div class="grid">
<button class="tile pink" onclick="show('animals')"><span>🐾</span>Животные</button><button class="tile blue" onclick="show('tech')"><span>🚒</span>Техника</button><button class="tile yellow" onclick="show('words')"><span>🍎</span>Первые слова</button><button class="tile green" onclick="show('games')"><span>🎲</span>Игры</button><button class="tile purple" onclick="show('favorites')"><span>❤️</span>Избранное</button></div></section>
<section id="animals" class="view"><div class="top"><button class="back" onclick="show('home')">← Назад</button><h2>Животные</h2></div><div id="animalList" class="cards"></div></section>
<section id="tech" class="view"><div class="top"><button class="back" onclick="show('home')">← Назад</button><h2>Техника</h2></div><div id="techList" class="cards"></div></section>
<section id="words" class="view"><div class="top"><button class="back" onclick="show('home')">← Назад</button><h2>Первые слова</h2></div><div id="wordList" class="cards"></div></section>
<section id="favorites" class="view"><div class="top"><button class="back" onclick="show('home')">← Назад</button><h2>Избранное</h2></div><div id="favList" class="cards"></div></section>
<section id="games" class="view"><div class="top"><button class="back" onclick="show('home')">← Назад</button><h2>Игры</h2></div><div class="game"><h3>Угадай, кто говорит!</h3><p id="question">Нажми «Начать»</p><div id="choices"></div><button class="sound" onclick="question()">Начать 🎉</button><p id="score">Правильных ответов: 0</p></div></section>
</main><script src="sounds.js"></script><script>
const animals=[['Кошка','🐱','мяу'],['Собака','🐶','гав'],['Корова','🐮','му'],['Лев','🦁','рык'],['Слон','🐘','труба'],['Лошадь','🐴','и-го-го'],['Пони','🐎','и-го-го'],['Утка','🦆','кря'],['Петух','🐓','кукареку'],['Овца','🐑','бе'],['Свинья','🐷','хрю'],['Лягушка','🐸','ква'],['Лиса','🦊','рык'],['Ворона','🐦‍⬛','кар'],['Дельфин','🐬','пи']];
const tech=[['Пожарная машина','🚒','сирена'],['Полиция','🚓','сирена'],['Скорая','🚑','сирена'],['Мусоровоз','🚛','мотор'],['Такси','🚕','гудок'],['Мотоцикл','🏍️','мотор'],['Автомобиль','🚗','мотор'],['Джип','🚙','мотор'],['Самокат','🛴','гудок'],['Трактор','🚜','мотор'],['Экскаватор','🚧','мотор'],['Бульдозер','🚜','мотор'],['Кран','🏗️','мотор'],['Самолёт','✈️','самолёт'],['Вертолёт','🚁','мотор'],['Поезд','🚆','гудок'],['Автобус','🚌','гудок'],['Велосипед','🚲','гудок']];
const words=[['Яблоко','🍎'],['Банан','🍌'],['Мяч','⚽'],['Молоко','🥛'],['Мишка','🧸'],['Ботинок','👟'],['Дверь','🚪'],['Вода','💧'],['Кубики','🧱'],['Книга','📚'],['Мама','👩'],['Папа','👨'],['Чашка','☕'],['Кровать','🛏️']];
let fav=[];try{fav=JSON.parse(localStorage.getItem('vovki-fav')||'[]')}catch(e){}let points=0,current;
function say(t){if(window.playSoundForPhrase)window.playSoundForPhrase(t);if(window.speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=.85;speechSynthesis.speak(u)}}
function card(x,type){let d=document.createElement('div');d.className='card';d.innerHTML='<span class="emoji">'+x[1]+'</span><span class="name">'+x[0]+'</span>';let b=document.createElement('button');b.className='sound';b.textContent='🔊 Слушать';b.onclick=()=>say(x[0]+'! '+(x[2]||''));let f=document.createElement('button');f.className='sound';f.textContent='♡ В избранное';f.onclick=()=>{let k=type+':'+x[0];let i=fav.findIndex(z=>z.k===k);if(i<0)fav.push({k,x,type});else fav.splice(i,1);localStorage.setItem('vovki-fav',JSON.stringify(fav));fillFav()};d.append(b,f);return d}
function fill(id,arr,type){let e=document.getElementById(id);e.innerHTML='';arr.forEach(x=>e.append(card(x,type)))}
function fillFav(){let e=document.getElementById('favList');e.innerHTML='';fav.forEach(z=>e.append(card(z.x,z.type)))}
function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='favorites')fillFav()}
function question(){current=animals[Math.floor(Math.random()*animals.length)];document.getElementById('question').textContent='Кто говорит: «'+current[2]+'»?';let opts=[current,...animals.filter(x=>x!==current).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5),e=document.getElementById('choices');e.innerHTML='';opts.forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x[1]+' '+x[0];b.onclick=()=>{if(x===current){points++;say('Правильно! '+x[0]);document.getElementById('question').textContent='Правильно! ⭐ Молодец!'}else{say('Попробуй ещё раз');document.getElementById('question').textContent='Попробуй ещё раз!'}document.getElementById('score').textContent='Правильных ответов: '+points};e.append(b)});if(window.playSoundForPhrase)window.playSoundForPhrase(current[2])}
fill('animalList',animals,'animal');fill('techList',tech,'tech');fill('wordList',words,'word');
</script></body></html>
